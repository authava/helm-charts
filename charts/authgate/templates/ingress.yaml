{{- if and .Values.ingress.enabled .Values.ingress.kubernetes.enabled (not .Values.traefik.enabled) -}}
{{- $fullName := include "authgate.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: authgate
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.kubernetes.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.kubernetes.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .path "/admin" }}{{ $fullName }}-authgate{{ else }}{{ $fullName }}-authgate-admin-ui{{ end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}