apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authgate-secrets
  labels:
    app.kubernetes.io/name: authgate
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- if eq .Values.authgate.config.configBackend "postgres" }}
  database-url: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password .Release.Name .Values.postgresql.auth.database | b64enc | quote }}
  {{- end }}
  {{- if .Values.authgate.config.adminApi.token }}
  admin-token: {{ .Values.authgate.config.adminApi.token | b64enc | quote }}
  {{- end }}
  {{- if and .Values.authgate.config.cache.enabled (eq .Values.authgate.config.cache.backend "redis") .Values.redis.enabled }}
  redis-url: {{ printf "redis://%s-redis-master:6379" .Release.Name | b64enc | quote }}
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.tokenHandoff.enabled .Values.tokenHandoff.config.defaultToken }}
  token-handoff-token: {{ .Values.tokenHandoff.config.defaultToken | b64enc | quote }}
  {{- end }}