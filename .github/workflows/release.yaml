name: Release Charts

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add any chart dependencies
        run: |
          for dir in charts/*; do
            if [ -f "$dir/Chart.yaml" ]; then
              helm dependency update "$dir"
            fi
          done

      - name: Package all charts
        run: |
          mkdir -p .cr-release-packages
          for dir in charts/*; do
            if [ -f "$dir/Chart.yaml" ]; then
              helm package "$dir" --destination .cr-release-packages
            fi
          done

      - name: Add .nojekyll to skip Jekyll processing
        run: touch .cr-release-packages/.nojekyll

      - name: Generate index.yaml
        run: |
          helm repo index .cr-release-packages --url https://authava.github.io/helm-charts

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .cr-release-packages
          publish_branch: gh-pages
